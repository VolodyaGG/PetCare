name: Backend CI

on:
  push:
    paths: ["backend/**", "compose.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "compose.yaml", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: petcare
          POSTGRES_PASSWORD: petcare_ci
          POSTGRES_DB: petcare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petcare -d petcare_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://petcare:petcare_ci@localhost:5432/petcare_test
      TEST_DATABASE_URL: postgresql+psycopg2://petcare:petcare_ci@localhost:5432/petcare_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build local image
        run: docker build -t petcare-backend:ci .
      - name: Check Compose configuration
        working-directory: .
        run: docker compose config --quiet
