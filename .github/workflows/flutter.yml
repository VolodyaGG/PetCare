name: Flutter CI

on:
  push:
    paths: ["mobile/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.project.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: project
        shell: bash
        run: |
          if [ -f mobile/pubspec.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Flutter project is not added yet; expected at mobile/." >> "$GITHUB_STEP_SUMMARY"
          fi
  checks:
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build ios --simulator --debug
