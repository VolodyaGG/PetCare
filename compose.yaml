name: petcare

x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg2://petcare:petcare_local@db:5432/petcare
    DB_CONNECT_TIMEOUT: "3"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare_local
      POSTGRES_DB: petcare
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3

volumes:
  postgres_data:
